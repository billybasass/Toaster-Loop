[project]
name = "toaster-loop"
version = "0.1.0"
description = "Local self-improving agent system: built-in agent runtime and training pipeline over local llama.cpp-served models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "toaster-loop" }]
# Keep dependencies minimal (see DECISIONS D-1/D-4): the agent runtime,
# toolset and curation pipeline are built in and need only these. The GPU
# training stack (torch/transformers/peft/trl) lives under the [training]
# extra and is imported lazily only inside `python -m toaster_loop.training.worker`.
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
  # Native screen capture (take_screenshot → ImageGrab) on Windows/macOS/X11.
  # Small, stable, no native deps beyond libjpeg/libz. Imported lazily inside
  # _try_pillow so text-only agents never touch it.
  "Pillow>=10.0",
]

[project.optional-dependencies]
# pytest-timeout: a hung test must fail CI, not wedge a runner (the plugin is
# also a local guard; --timeout is set in [tool.pytest.ini_options]).
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11",
       # Artifacts smoke: CI builds the wheel and installs it into a clean venv
       # (packaging regressions — e.g. missing dashboard static — otherwise
       # ship silently since every test runs from the source tree).
       "build>=1.2",
       # Local git hooks mirroring the CI gates (.pre-commit-config.yaml).
       "pre-commit>=3.7"]
# Upper bounds: transformers/trl churn their trainer APIs between majors, and
# uv.lock resolves to 5.x/1.x today (validated by scripts/ci_train_smoke.py in
# CI). Bounding keeps a fresh `uv sync` from silently pulling an incompatible
# major; bump deliberately together with a smoke run.
training = [
  "torch>=2.4,<3",
  "transformers>=4.45,<6",
  "peft>=0.13,<1",
  "trl>=0.12,<2",
  "datasets>=3.0,<6",
  "accelerate>=0.34,<2",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
  # Pre-quantized HF checkpoints (compressed-tensors format, e.g. NVFP4/
  # FP8 releases) carry a quantization_config transformers cannot even parse
  # without this package — the worker died at from_pretrained without it.
  "compressed-tensors>=0.15",
]

[project.scripts]
toaster-loop = "toaster_loop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["toaster_loop*"]

[tool.setuptools.package-data]
"toaster_loop.dashboard" = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg",
  "static/js/*.js", "static/js/panels/*.js"]

# Lint (CI: `ruff check toaster-loop tests`). Scope is correctness-first:
# syntax/import errors (E4, E9), real bugs (F). Style rules are deliberately
# off — the codebase has its own dense-comment style. BLE001 (bare except) is
# intentionally NOT enabled repo-wide: broad exception handling is a core
# resilience pattern here (best-effort cleanup must never crash a run); the
# convention is an explicit `# noqa: BLE001 - <reason>` annotation at each
# site. Audit with `ruff check --select BLE toaster-loop` when reviewing that
# convention.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately bind fixtures/locals they don't read, and import after
# sys.path setup.
"tests/*" = ["F841", "E402", "F811"]

# mypy — incremental adoption (production-readiness pass). The store/registry
# core is clean and GATES CI; other packages have a known error budget listed
# per-module below (see the counts at time of writing) so CI stays green while
# they are cleaned up module by module. Run locally: `mypy toaster-loop` (all
# modules, report only) or `mypy` (gated subset).
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
# Default target when `mypy` runs with no args (the CI gate).
files = ["toaster_loop/store", "toaster_loop/registry", "toaster_loop/core/config.py"]

# Known-debt modules: report but never gate (raise the bar by deleting a
# module from this list once it is clean).
[[tool.mypy.overrides]]
module = [
  "toaster_loop.curate.*",
  "toaster_loop.serving.*",
  "toaster_loop.training.*",
  "toaster_loop.dashboard.*",
  "toaster_loop.core.*",
  "toaster_loop.evaluation.*",
  "toaster_loop.cli",
]
ignore_errors = true

[tool.pytest.ini_options]
# Per-test ceiling so a hang fails fast instead of eating the job timeout.
# Generous: the hermetic suite's slowest tests are process-lifecycle ones.
timeout = 180
